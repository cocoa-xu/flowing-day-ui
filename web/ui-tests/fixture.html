<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowingDayUI Browser Tests</title>
    <script type="module" src="/ui-tests/fixture.ts"></script>
  </head>
  <body>
    <main>
      <section class="controls">
        <fd-slider id="slider" min="0" max="10" step="1" value="2"></fd-slider>
        <fd-popup id="popup" value="standard">
          <fd-option value="standard">Standard</fd-option>
          <fd-option value="compact">Compact</fd-option>
          <fd-option value="detailed">Detailed</fd-option>
        </fd-popup>
      </section>
      <fd-graph-canvas id="graph"></fd-graph-canvas>
      <section class="primitives">
        <fd-text-field
          id="text-field"
          label="Project name"
          placeholder="Name"
          symbol="pencil"
        ></fd-text-field>
        <fd-secure-field
          id="secure-field"
          label="Access key"
          placeholder="Access key"
          symbol="lock"
          emphasis="accented"
        ></fd-secure-field>
        <fd-icon-button
          id="pin-button"
          label="Pin"
          symbol="pin"
          emphasis="standard"
          toggle
        ></fd-icon-button>
        <fd-progress id="progress" label="Indexing" value="0.64"></fd-progress>
        <fd-text-area
          id="text-area"
          label="Notes"
          placeholder="Add notes"
          minimum-height="84"
        ></fd-text-area>
      </section>
    </main>
  </body>
</html>
