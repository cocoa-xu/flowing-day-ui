<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowingDayUI Browser Tests</title>
    <script type="module" src="/ui-tests/fixture.ts"></script>
  </head>
  <body>
    <main>
      <section class="controls">
        <fd-slider id="slider" min="0" max="10" step="1" value="2"></fd-slider>
        <fd-select id="popup" value="standard">
          <fd-option value="standard">Standard</fd-option>
          <fd-option value="compact">Compact</fd-option>
          <fd-option value="detailed">Detailed</fd-option>
        </fd-select>
      </section>
      <fd-graph-canvas id="graph"></fd-graph-canvas>
      <section class="primitives">
        <fd-text-field
          id="text-field"
          label="Project name"
          placeholder="Name"
          symbol="pencil"
        ></fd-text-field>
        <fd-secure-field
          id="secure-field"
          label="Access key"
          placeholder="Access key"
          symbol="lock"
          emphasis="accented"
        ></fd-secure-field>
        <fd-icon-button
          id="pin-button"
          label="Pin"
          symbol="pin"
          emphasis="standard"
          toggle
        ></fd-icon-button>
        <fd-progress id="progress" label="Indexing" value="0.64"></fd-progress>
        <fd-text-area
          id="text-area"
          label="Notes"
          placeholder="Add notes"
          minimum-height="84"
        ></fd-text-area>
      </section>
      <section class="selection-primitives">
        <fd-checkbox id="checkbox" label="Show guides"></fd-checkbox>
        <fd-multi-select id="multi-select" label="Visible devices">
          <fd-option value="usb" selected>USB</fd-option>
          <fd-option value="display">Display</fd-option>
          <fd-option value="network">Network</fd-option>
        </fd-multi-select>
        <fd-connected-segmented-control id="segmented" label="Canvas tool" value="select">
          <fd-option value="select">Select</fd-option>
          <fd-option value="pan">Pan</fd-option>
          <fd-option value="connect">Connect</fd-option>
        </fd-connected-segmented-control>
        <fd-disclosure id="disclosure" label="Advanced">
          <p>Additional controls</p>
        </fd-disclosure>
        <fd-search-picker id="search-picker" label="City" value="berlin">
          <fd-option value="amsterdam">Amsterdam</fd-option>
          <fd-option value="berlin">Berlin</fd-option>
          <fd-option value="copenhagen">Copenhagen</fd-option>
          <fd-option value="dublin">Dublin</fd-option>
        </fd-search-picker>
      </section>
      <section class="presentation-primitives">
        <fd-tabs id="tabs" label="Reference section" value="overview" variant="soft-surface">
          <fd-option value="overview">Overview</fd-option>
          <fd-option value="details">Details</fd-option>
          <fd-option value="history" disabled>History</fd-option>
          <article slot="overview">Overview content</article>
          <article slot="details">
            <button id="details-action" type="button">Details action</button>
          </article>
          <article slot="history">History content</article>
        </fd-tabs>
        <div class="overlay-triggers">
          <button id="dialog-trigger" type="button">Open Dialog</button>
          <fd-popover id="popover" accessibility-label="Canvas actions">
            <button id="popover-trigger" slot="trigger" type="button">More</button>
            <button id="popover-action" type="button">Duplicate</button>
          </fd-popover>
          <fd-tooltip id="tooltip" accessibility-text="Pin this canvas" message="Pin this canvas" delay="0.04">
            <button id="tooltip-trigger" slot="trigger" type="button">Pin</button>
          </fd-tooltip>
        </div>
        <fd-dialog
          id="dialog"
          heading="Remove Canvas?"
          message="This action cannot be undone."
          confirmation-kind="destructive"
          confirm-label="Remove"
        >
          The canvas and its local history will be removed.
        </fd-dialog>
      </section>
    </main>
  </body>
</html>
