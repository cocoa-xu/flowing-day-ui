<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Afloat — Settings</title>
    <link rel="stylesheet" href="./src/window.css" />
  </head>
  <body>
    <button id="scheme" class="scheme" type="button">Light</button>

    <main class="stage">
      <fd-settings-window
        id="window"
        app-name="Afloat"
        settings-title="Settings"
        sidebar-footer="Version 1.6.0 (2461)"
        page="general"
      >
        <img slot="app-icon" src="./src/app-icon.svg" alt="" />

        <fd-page-group>
          <fd-page
            page-id="general"
            label="General"
            subtitle="Application behavior and startup"
            symbol="gearshape"
          >
            <fd-pane-stack>
              <fd-section label="Startup" footer="Applies the next time Afloat launches.">
                <fd-switch-row
                  symbol="power"
                  label="Launch at login"
                  caption="Start Afloat automatically when you sign in."
                  checked
                ></fd-switch-row>
                <fd-separator indented></fd-separator>
                <fd-switch-row symbol="eye" label="Show in menu bar" checked></fd-switch-row>
              </fd-section>

              <fd-section label="Behavior">
                <fd-popup-row label="When closing the last window" value="hide" min-width="200">
                  <fd-option value="hide">Hide Afloat</fd-option>
                  <fd-option value="quit">Quit Afloat</fd-option>
                  <fd-option value="ask">Ask every time</fd-option>
                </fd-popup-row>
                <fd-separator></fd-separator>
                <fd-popup-row
                  label="Reopen windows"
                  caption="Restores the layout from your previous session."
                  value="always"
                >
                  <fd-option value="always">Always</fd-option>
                  <fd-option value="never">Never</fd-option>
                </fd-popup-row>
              </fd-section>
            </fd-pane-stack>
          </fd-page>

          <fd-page
            page-id="appearance"
            label="Appearance"
            subtitle="Theme, density and accent"
            symbol="paintbrush"
          >
            <fd-pane-stack>
              <fd-section label="Theme">
                <fd-popup-row label="Appearance" value="system">
                  <fd-option value="system">Match System</fd-option>
                  <fd-option value="light">Light</fd-option>
                  <fd-option value="dark">Dark</fd-option>
                </fd-popup-row>
                <fd-separator></fd-separator>
                <fd-popup-row label="Density" value="comfortable">
                  <fd-option value="comfortable">Comfortable</fd-option>
                  <fd-option value="compact">Compact</fd-option>
                </fd-popup-row>
              </fd-section>

              <fd-section
                label="Window"
                footer="Reduced transparency also disables the sidebar blur."
              >
                <fd-switch-row label="Reduce transparency"></fd-switch-row>
                <fd-separator></fd-separator>
                <fd-switch-row label="Show row separators" checked></fd-switch-row>
              </fd-section>
            </fd-pane-stack>
          </fd-page>
        </fd-page-group>

        <fd-page-group label="Monitors">
          <fd-page
            page-id="network"
            label="Network"
            subtitle="Throughput, interfaces and sampling"
            symbol="network"
          >
            <fd-pane-stack>
              <fd-section label="Display">
                <fd-switch-row label="Show network activity" checked></fd-switch-row>
                <fd-separator indented></fd-separator>
                <fd-switch-row label="Show throughput chart" checked></fd-switch-row>
              </fd-section>

              <fd-section label="Sampling">
                <fd-popup-row symbol="bolt" label="Refresh interval" value="2s">
                  <fd-option value="1s">Every second</fd-option>
                  <fd-option value="2s">Every 2 seconds</fd-option>
                  <fd-option value="5s">Every 5 seconds</fd-option>
                  <fd-option value="10s">Every 10 seconds</fd-option>
                </fd-popup-row>
              </fd-section>
            </fd-pane-stack>
          </fd-page>

          <fd-page
            page-id="usb"
            label="USB Devices"
            subtitle="Connected hardware"
            symbol="cable.connector"
            accent="#B4795E"
            accent-foreground="#C99372"
          >
            <fd-pane-stack>
              <fd-section
                label="Devices"
                footer="This page carries its own accent, retinting the whole window."
              >
                <fd-switch-row
                  symbol="cable.connector"
                  label="Show USB devices"
                  checked
                ></fd-switch-row>
                <fd-separator indented></fd-separator>
                <fd-switch-row label="Copy identifiers on click"></fd-switch-row>
              </fd-section>
            </fd-pane-stack>
          </fd-page>
        </fd-page-group>

        <fd-page-group label="Advanced">
          <fd-page
            page-id="keyboard"
            label="Keyboard"
            subtitle="Global shortcuts"
            symbol="keyboard"
          >
            <fd-pane-stack>
              <fd-section label="Shortcuts">
                <fd-popup-row label="Toggle Afloat" value="opt-space" min-width="180">
                  <fd-option value="opt-space">⌥ Space</fd-option>
                  <fd-option value="ctrl-space">⌃ Space</fd-option>
                  <fd-option value="cmd-shift-a">⌘ ⇧ A</fd-option>
                  <fd-option value="none">None</fd-option>
                </fd-popup-row>
              </fd-section>
            </fd-pane-stack>
          </fd-page>

          <fd-page
            page-id="updates"
            label="Updates"
            subtitle="Release channel and checks"
            symbol="arrow.triangle.2.circlepath"
          >
            <fd-pane-stack>
              <fd-section label="Automatic updates">
                <fd-switch-row label="Check for updates" checked></fd-switch-row>
                <fd-separator indented></fd-separator>
                <fd-popup-row label="Channel" value="stable">
                  <fd-option value="stable">Stable</fd-option>
                  <fd-option value="beta">Beta</fd-option>
                  <fd-option value="nightly">Nightly</fd-option>
                </fd-popup-row>
              </fd-section>
            </fd-pane-stack>
          </fd-page>

          <fd-page
            page-id="privacy"
            label="Privacy"
            subtitle="Requires a full disk access grant"
            symbol="lock.shield"
            unavailable
          >
            <fd-pane-stack>
              <fd-section label="Privacy">
                <fd-row label="Unavailable"></fd-row>
              </fd-section>
            </fd-pane-stack>
          </fd-page>

          <fd-page
            page-id="about"
            label="About"
            subtitle="Version and project information"
            symbol="info.circle"
          >
            <fd-pane-stack>
              <fd-section label="Afloat">
                <fd-row label="Version" caption="1.6.0 (2461)"></fd-row>
                <fd-separator></fd-separator>
                <fd-row label="Design toolkit" caption="FlowingDayUI"></fd-row>
              </fd-section>
            </fd-pane-stack>
          </fd-page>
        </fd-page-group>
      </fd-settings-window>
    </main>

    <script type="module" src="./src/window.ts"></script>
  </body>
</html>
