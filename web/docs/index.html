<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FlowingDayUI — web playground</title>
    <link rel="stylesheet" href="./src/playground.css" />
  </head>
  <body>
    <header class="bar">
      <h1>FlowingDayUI</h1>
      <div class="controls">
        <label>
          Accent
          <input id="accent" type="color" value="#6d9ea5" />
        </label>
        <label>
          Row inset
          <input id="inset" type="range" min="8" max="32" value="18" />
        </label>
        <button id="scheme" type="button">Toggle appearance</button>
      </div>
    </header>

    <main class="canvas">
      <fd-pane-stack>
        <fd-section label="Startup" footer="Applies the next time the app launches.">
          <fd-switch-row
            symbol="power"
            label="Launch at login"
            caption="Start automatically when you sign in."
            checked
          ></fd-switch-row>
          <fd-separator indented></fd-separator>
          <fd-switch-row symbol="eye" label="Show in menu bar"></fd-switch-row>
        </fd-section>

        <fd-section label="Appearance">
          <fd-row symbol="sparkles" label="Reduce transparency"></fd-row>
          <fd-separator></fd-separator>
          <fd-row
            label="Accent colour"
            caption="Every component reads the accent through one custom property."
          >
            <fd-switch slot="trailing" checked></fd-switch>
          </fd-row>
        </fd-section>

        <fd-section label="Scoped override">
          <fd-switch-row
            symbol="bolt"
            label="This section overrides the accent"
            caption="A single --fd-accent-fill on the section retints the subtree."
            checked
          ></fd-switch-row>
        </fd-section>
      </fd-pane-stack>
    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
